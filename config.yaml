# Job search agent settings. Personal details (resume, API keys, sheet ID)
# never go here: they come from environment variables / GitHub secrets.

timezone: America/Los_Angeles
run_hour: 8            # local hour the scheduled run is allowed to proceed
max_per_tab: 5         # new matches added per tab per day
min_score: 25          # ignore matches scoring below this (0-100)
lookback_days: 3       # how recent API results must be

# One spreadsheet tab per role track. A job goes to the first tab whose
# title pattern matches; patterns are case-insensitive regular expressions.
tabs:
  - name: Engineering Manager
    title_pattern: >-
      \b(engineering manager|manager,? (software |platform |infrastructure )?engineering|software (development |engineering )?manager|(sr\.?|senior) manager,? .*engineering|director,? (of )?(software |platform |infrastructure )?engineering|engineering director|head of (software |platform |infrastructure )?engineering|vp,? (of )?engineering)\b
    queries:
      - Engineering Manager
      - Director of Engineering
  - name: Senior Engineer & TL
    title_pattern: >-
      \b(staff|principal|senior|sr\.?|lead|distinguished)\b.*\b(engineer|developer|architect)\b|\btech(nical)? lead\b|\b(software|systems|network|infrastructure) architect\b
    queries:
      - Staff Software Engineer
      - Principal Software Engineer

# Titles containing any of these are never matches.
exclude_title_pattern: >-
  \b(intern|internship|new grad|junior|jr\.?|sales|solutions? engineer|customer|support|recruit\w*|account|marketing|designer|data scientist|product manager|program manager|mechanical|analog|asic|rtl|physical design)\b

# Descriptions containing these are skipped (citizenship / clearance only).
exclude_description_pattern: >-
  security clearance|clearance (is )?required|ts/sci|top secret|u\.?s\.? citizenship (is )?required|must be (a )?u\.?s\.? citizen|active (secret|ts) clearance

