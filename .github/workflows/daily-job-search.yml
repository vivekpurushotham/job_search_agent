name: Daily job search

on:
  schedule:
    # 8:00 AM Pacific. Cron is UTC-only: 15:00 UTC in daylight time, 16:00 UTC
    # in standard time. Both fire; the script skips the one that isn't 8 AM.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: # "Run workflow" button for a manual run

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find jobs and update the sheet
        run: python -m job_agent.main ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
